[project]
name = "amazon_ph_flow"
version = "0.1.0"
description = "Amazon PH Market Intelligence — multi-agent CrewAI workforce for Philippine e-commerce analysis"
authors = [{ name = "Amazon PH Crew", email = "crew@amazonph.ai" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]>=1.15.1,<2.0.0",
]

[project.scripts]
kickoff = "amazon_ph_flow.main:kickoff"
run_crew = "amazon_ph_flow.main:kickoff"
plot = "amazon_ph_flow.main:plot"
run_with_trigger = "amazon_ph_flow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
